*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#f0f4ff;min-height:100vh}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-bottom:2px solid #e0e0f0;flex-shrink:0;position:sticky;top:0;z-index:10}
.tab{padding:8px 4px;font-size:10.5px;font-weight:700;color:#888;border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;text-align:center;transition:all .2s;overflow:hidden;text-overflow:ellipsis}
.tab.active{color:#fff;border-bottom-color:transparent}
.tab[data-cat="0"].active{background:#FF6B6B}
.tab[data-cat="1"].active{background:#FF9F43}
.tab[data-cat="2"].active{background:#A29BFE}
.tab[data-cat="3"].active{background:#00B894}
.tab[data-cat="4"].active{background:#4A90D9}
.tab[data-cat="5"].active{background:#FF6B6B}
.tab[data-cat="6"].active{background:#FF9F43}
.tab[data-cat="7"].active{background:#A29BFE}
.tab[data-cat="8"].active{background:#00B894}
.tab[data-cat="9"].active{background:#4A90D9}
.cards-area{flex:1;padding:12px;overflow-y:auto}
.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{border-radius:20px;padding:14px 10px;text-align:center;cursor:pointer;position:relative;min-height:175px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid rgba(255,255,255,0.6);box-shadow:0 4px 15px rgba(0,0,0,0.1);transition:transform .15s;user-select:none}
.card:active{transform:scale(0.96)}
.card-emoji{font-size:50px;margin-bottom:5px;line-height:1}
.card-zh{font-size:26px;font-weight:700;line-height:1.1;margin-bottom:2px;color:#222}
.card-py{font-size:12px;color:#555;font-style:italic;margin-bottom:3px}
.card-en{font-size:14px;font-weight:600;text-transform:capitalize;color:#333}
.color-swatch{width:58px;height:58px;border-radius:50%;margin:0 auto 6px;border:3px solid rgba(0,0,0,0.12)}
.num-badge{position:absolute;top:8px;left:10px;font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,0.18);border-radius:20px;padding:1px 6px}
.bg-animal{background:linear-gradient(135deg,#FFF3E0,#FFE0B2)}
.bg-food{background:linear-gradient(135deg,#F3E5F5,#E1BEE7)}
.bg-color-card{background:linear-gradient(135deg,#E8F5E9,#C8E6C9)}
.bg-transport{background:linear-gradient(135deg,#E3F2FD,#BBDEFB)}
.bg-items{background:linear-gradient(135deg,#FFF8E1,#FFECB3)}
.story-area{flex:1;padding:12px;overflow-y:auto}
.story-card{border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 4px 15px rgba(0,0,0,0.08);border-left:6px solid #ccc}
.story-word{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:10px;color:#fff}
.story-zh{font-size:19px;font-weight:700;color:#222;line-height:1.5;margin-bottom:5px}
.story-py{font-size:14px;color:#555;font-style:italic;margin-bottom:5px}
.story-en{font-size:14px;color:#444;font-weight:500;margin-bottom:8px}
.speak-btn{font-size:12px;padding:6px 14px;border:none;border-radius:20px;cursor:pointer;font-weight:700;letter-spacing:.3px}
.intro-title{font-size:16px;font-weight:700;color:#fff;padding:10px 14px;border-radius:14px;display:inline-block;margin-bottom:4px}
.intro-sub{font-size:13px;color:#666;margin-bottom:12px}
.sc-animal{background:linear-gradient(135deg,#FFF0E8,#FFE4D6)}
.sc-food{background:linear-gradient(135deg,#FFF5E0,#FFE8C2)}
.sc-color{background:linear-gradient(135deg,#F0EEFF,#E2DAFF)}
.sc-transport{background:linear-gradient(135deg,#E0FFF4,#C5F5E4)}
.sc-items{background:linear-gradient(135deg,#E6F3FF,#CDE5FF)}
.intro{padding:10px 12px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.intro-bar-title{font-size:15px;font-weight:700;color:#333}
.intro-count{font-size:11px;color:#aaa;font-weight:600}
</style>
</head>

let voices = [];
function loadVoices() { voices = window.speechSynthesis.getVoices(); }
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}
function getBestVoice(lang) {
  const preferred = lang === 'zh' ? ['zh-TW','zh-HK','zh-CN','zh'] : ['en-US','en-GB','en-AU','en'];
  for (const p of preferred) { const v = voices.find(x => x.lang.startsWith(p)); if (v) return v; }
  return null;
}
function speakSlow(text, lang, onEnd) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === 'zh' ? 'zh-TW' : 'en-US';
  u.rate = 0.72; u.pitch = 1.15;
  const v = getBestVoice(lang); if (v) u.voice = v;
  if (onEnd) u.onend = onEnd;
  window.speechSynthesis.speak(u);
}
function speakCard(zh, en) {
  speakSlow(zh, 'zh', () => setTimeout(() => speakSlow(en, 'en'), 400));
}
function speakSen(zh, en) {
  speakSlow(zh, 'zh', () => setTimeout(() => speakSlow(en, 'en'), 600));
}

function showCat(n) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-cat="${n}"]`).classList.add('active');
  const el = document.getElementById('content');
  window.speechSynthesis && window.speechSynthesis.cancel();

  if (n < 5) {
    const group = cards.filter(c => c.cat === n);
    let html = '<div class="cards-area"><div class="card-grid">';
    group.forEach(c => {
      let inner;
      if (c.swatch) {
        inner = `<div class="color-swatch" style="background:${c.swatch}"></div>`;
      } else if (c.emoji === 'TOOTHBRUSH') {
        inner = `<div style="margin-bottom:5px">${TOOTHBRUSH_SVG}</div>`;
      } else if (!c.emoji) {
        inner = `<div class="card-emoji">${c.emoji||'☁️'}</div>`;
      } else {
        inner = `<div class="card-emoji">${c.emoji}</div>`;
      }
      html += `<div class="card ${c.bg}" onclick="speakCard('${c.zh}','${c.en}')">
        <span class="num-badge">#${c.num}</span>
        ${inner}
        <div class="card-zh">${c.zh}</div>
        <div class="card-py">${c.py}</div>
        <div class="card-en">${c.en}</div>
      </div>`;
    });
    html += '</div></div>';
    el.innerHTML = html;
  } else {
    const s = stories[n - 5];
    const wordList = cards.filter(c => c.cat === n - 5);
    let html = `<div class="story-area">
      <div style="text-align:center;padding:10px 0 14px">
        <div class="intro-title" style="background:${s.color}">${s.title}</div>
        <div class="intro-sub">${s.intro}</div>
      </div>`;
    s.sentences.forEach((sen, i) => {
      const w = wordList[i];
      const ico = w.swatch
        ? `<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${w.swatch};vertical-align:middle;margin-right:4px;border:1px solid rgba(0,0,0,0.15)"></span>`
        : w.emoji === 'TOOTHBRUSH' ? '🪥 ' : `${w.emoji} `;
      const zhSafe = sen.zh.replace(/'/g,"\\'");
      const enSafe = sen.en.replace(/'/g,"\\'");
      html += `<div class="story-card ${s.bgCls}" style="border-left-color:${s.color}">
        <span class="story-word" style="background:${s.color}">${ico}${w.zh} · ${w.en}</span>
        <div class="story-zh">${sen.zh}</div>
        <div class="story-py">${sen.py}</div>
        <div class="story-en">${sen.en}</div>
        <button class="speak-btn" style="background:${s.color};color:#fff" onclick="speakSen('${zhSafe}','${enSafe}')">🔊 聽一聽 Listen</button>
      </div>`;
    });
    html += '</div>';
    el.innerHTML = html;
  }
}

showCat(0);
</script>
</body>
</html>
